name: VanillaHeroCheat Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '2.0'

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build dylib
      run: |
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        CLANG=$(xcrun --find clang)
        
        echo "=== Building VanillaHeroCheat v${{ github.event.inputs.version }} ==="
        echo "SDK: $SDK"
        echo "Clang: $CLANG"
        
        # 使用Objective-C++编译（支持.xm文件和C++代码）
        $CLANG \
          -arch arm64 \
          -isysroot "$SDK" \
          -miphoneos-version-min=14.0 \
          -fobjc-arc \
          -fobjc-abi-version=2 \
          -x objective-c++ \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework QuartzCore \
          -o VanillaHeroCheat.dylib \
          VanillaHeroCheat_v2.xm
        
        echo "=== Build Complete ==="
        ls -lh VanillaHeroCheat.dylib
        file VanillaHeroCheat.dylib
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VanillaHeroCheat_v${{ github.event.inputs.version }}
        path: VanillaHeroCheat.dylib
        if-no-files-found: error
